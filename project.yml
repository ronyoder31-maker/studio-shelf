name: StudioShelf
options:
  bundleIdPrefix: com.ronyoder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    revision: 89854c93207ad0d2b3d78d6f1aea24595ca66552
  swift-lame:
    url: https://github.com/Phisto/swift-lame
    revision: 727f4ad56195e062560e71468eeb6bd244b9167d
targets:
  StudioShelf:
    type: application
    platform: iOS
    sources:
      - path: StudioShelf
    dependencies:
      - package: YouTubeKit
      - package: swift-lame
        product: lame
    info:
      path: StudioShelf/Resources/Info.plist
      properties:
        CFBundleDisplayName: StudioShelf
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronyoder.studioshelf
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  StudioShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StudioShelfTests
    dependencies:
      - target: StudioShelf
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StudioShelf.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StudioShelf"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  StudioShelf:
    build:
      targets:
        StudioShelf: all
        StudioShelfTests: [test]
    test:
      targets:
        - StudioShelfTests
